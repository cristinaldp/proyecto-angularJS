<!DOCTYPE html>
<html lang="es" ng-app="miApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visto recientemente - Sinfonía Urbana</title>

    <link rel="stylesheet" href="css/styles.css">

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    
    <script src="js/i18n.js"></script>
    <script src="js/visto_recientemente_app.js"></script>
    <script src="js/login_reutilizable.js"></script>
</head>

<body>

    <login-widget></login-widget>

    <div ng-controller="VistoRecientementeController" ng-init="cargarVistas()">

        <header>
            <h1>{{ t.tituloApp }}</h1>

            <button class="btn-menu-movil" ng-click="menuMovilAbierto = !menuMovilAbierto">
                ☰
            </button>

            <nav ng-class="{ 'nav-abierto': menuMovilAbierto }">
                <ul>
                    <li><a href="./artistas.html">{{ t.menuArtistas }}</a></li>
                    <li><a href="./albumes.html">{{ t.menuAlbumes }}</a></li>
                    <li><a href="./canciones.html">{{ t.menuCanciones }}</a></li>
                    <li><a href="./top.html">{{ t.menuTop }}</a></li>
                    <li><a href="./novedades.html">{{ t.menuNovedades }}</a></li>
                    <li><a href="./generos.html">{{ t.menuGeneros }}</a></li>
                </ul>
            </nav>
        </header>

        <main class="contenedor-principal">

            <section class="mensajes">
                <h2>Visto recientemente</h2>
                <br>
                <hr>
                <p class="mensaje" ng-if="mensaje">{{ mensaje }}</p>
            </section>

            <section class="resultados" ng-if="canciones.length > 0">

                <div class="tarjeta-cancion"
                     ng-repeat="cancion in canciones track by $index"
                     ng-click="abrirVideo(cancion)">

                    <img class="miniatura-video"
                         ng-if="cancion.miniaturaUrl"
                         ng-src="{{ cancion.miniaturaUrl }}"
                         alt="{{ cancion.titulo }}">

                    <h3>{{ cancion.titulo }}</h3>
                    <p>
                        <strong>Visto el:</strong>
                        {{ cancion.fechaVista | date:'dd/MM/yyyy HH:mm' }}
                    </p>

                </div>

            </section>

        </main>

    </div>

</body>

</html>
