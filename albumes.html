<!DOCTYPE html>
<html lang="es" ng-app="miApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albumes - Sinfonía Urbana</title>

    <link rel="stylesheet" href="css/styles.css">

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="js/album_app.js"></script>
    <script src="js/login_reutilizable.js"></script>

</head>

<body>

    <login-widget></login-widget>

    <div ng-controller="AlbumController" ng-init="cargarAleatorios()">

        <header>
            <h1>Sinfonía Urbana</h1>

            <button class="btn-menu-movil" ng-click="menuMovilAbierto = !menuMovilAbierto">
                ☰
            </button>

            <nav ng-class="{ 'nav-abierto': menuMovilAbierto }">
                <ul>
                    <li><a href="./artistas.html">Artistas</a></li>
                    <li><a href="./albumes.html" class="active">Álbumes</a></li>
                    <li><a href="./canciones.html">Canciones</a></li>
                    <li><a href="./top.html">Top global</a></li>
                    <li><a href="./novedades.html">Novedades</a></li>
                    <li><a href="./generos.html">Géneros</a></li>
                </ul>
            </nav>
        </header>

        <main class="contenedor-principal">

            <section class="busqueda">
                <input type="text" ng-model="busqueda" placeholder="¿Qué album quieres buscar?"
                    ng-keypress="$event.which === 13 && buscarAlbumes()">
                <button ng-click="buscarAlbumes()">Buscar</button>
                <button ng-click="cargarAleatorios()">Mostrar aleatorios</button>
            </section>

            <section class="mensajes">
                <p class="mensaje" ng-if="mensaje">{{ mensaje }}</p>
                <h2 class="titulo-albumes">Álbumes</h2>
                <br>
                <hr>
            </section>

            <section class="resultados-albumes" ng-if="albumes.length > 0">

                <div class="tarjeta-album" ng-repeat="album in albumes track by album.id"
                    ng-click="abrirAlbumSpotify(album)">

                    <div class="vinilo-wrapper">
                        <div class="disco"></div>
                        <div class="funda">
                            <img ng-src="http://localhost:8085/api/albumes/{{ album.id }}/imagen"
                                alt="{{ album.titulo }}">
                        </div>
                    </div>


                    <h3>{{ album.titulo }}</h3>
                    <button class="btn-artista" ng-click="$event.stopPropagation(); verArtista(album.idArtista)">
                        Más sobre {{ album.nombreArtista }}
                    </button>
                </div>
            </section>

            <section ng-if="albumes.length === 0 && !cargando && !mensaje">
                <p>No hay albumes para mostrar.</p>
            </section>
            <br>
        </main>

        <footer>
            <div class="footer-content">
                <div>
                    <h3>Proyecto</h3>
                    <hr>
                    <p>Sinfonía Urbana</p>
                </div>

                <div>
                    <h3>Contacto</h3>
                    <hr>
                    <p>yaiza5arias@gmail.com</p>
                    <p>cristinalopezdelapuente@gmail.com</p>
                </div>
            </div>
        </footer>
    </div>
</body>

</html>
